name: Flutter Android Build CI

on:
  push:
    branches:
      - main     # Triggers the build whenever you push to your main branch
  workflow_dispatch: # Allows you to manually click a button on GitHub to build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Compile Release APK Installer
        run: flutter build apk --release

      - name: Upload Completed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketstrike-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
